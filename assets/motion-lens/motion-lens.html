<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seeing Through Motion</title>
<!--
  Lens demo: a lens (a receptive field) moves over a natural image (drag it, or let it wander).

  FILES (same folder): forest.png. Without the image, a procedural forest is drawn.

  EMBED MODE (?embed): used by the website hero. Hides the status line, draws the image at the
  full width (its full height, or cropped to the iframe's height), and publishes the image height
  to the host's .hero element (--hero-image-h) so the page can size the iframe. When the host overlays its text on the image's left, the lens stays
  in the right part (embedLensMinX). Also lets vertical swipes scroll the page on touch screens,
  and pauses while scrolled out of view.
-->
<style>
  :root{
    --bg:#07080a; --fg:#e9e6df; --muted:#8c8981;
  }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block}
  #stage.steering{cursor:none}   /* the lens replaces the cursor only where it can follow it */
  #hint{position:fixed;top:18px;left:20px;font-size:13px;line-height:1.5;color:var(--muted);
    letter-spacing:.02em;transition:opacity 1.2s ease;pointer-events:none}
  #hint b{color:var(--fg);font-weight:600}
  #status{position:fixed;top:18px;right:20px;font-size:11px;color:var(--muted);
    opacity:.7;pointer-events:none;text-align:right}
  .embed body{touch-action:pan-y}
  .embed #status{display:none}
  .embed #hint{left:auto;right:20px;text-align:right}
  @media (max-width:640px){
    #hint{font-size:12px;left:16px;top:14px}
    #status{display:none}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hint"><b>Move the lens to look around.<br>Draw circles to roll.</b></div>
<div id="status"></div>

<script>
(() => {
"use strict";

/* ===================== CONFIG ===================== */
const CONFIG = {
  imageUrl: "forest.png",
  downsample: 20,                   // image px per model px (training: 20)

  // Lens: one model patch, P·downsample image pixels square
  maxLensFraction: 0.6,             // of the smaller screen side; the image is zoomed out to fit
  lensRadius: 10,
  outsideVisibility: 0.16,          // brightness of the image outside the lens (0 = hidden)
  // embed, text overlaid: gradient behind the host's text
  textShade: [0.7, 0.55],           // opacity at the left edge, at the text's right edge
  textFade: 220,                    // px past the text over which it fades out
  lensFollow: 0.06,                 // s, how tightly the lens follows the cursor

  rollGain: 0.12,                   // lens roll from circular pointer motion
  maxRoll: 90,                      // deg/s

  // Idle motion: fixations (slow smooth drift) separated by saccades (minimum-jerk jumps)
  idleDelay: 2500,                  // ms
  fixation: [0.5, 1.6],             // s, fixation duration range
  saccadeAmp: [0.12, 0.38],         // fraction of the smaller screen side
  saccadeDur: [0.18, 0.0012],       // s: intercept + slope per px (main sequence); peak speed ≈ 1.9·amp/dur
  saccadeRoll: 10,                  // deg, sd of the roll change per saccade (pulled back toward upright)
  driftSigma: 14,                   // px/s, drift during fixation
  driftTau: 0.4,                    // s, drift smoothness
  wander: [0.32, 0.3],              // saccade targets: half-extent around home (fraction of width, height)

  // Where the idle lens wanders around (fraction of width, height)
  home: [0.5, 0.42],
  homeEmbed: [0.72, 0.42],          // embed mode, wide screens: right of the overlaid text
  embedLensMinX: 0.5,               // embed, text overlaid: the lens stays right of this fraction of the width
  steerPad: 0.5,                    // the pointer steers the lens this many lens sizes beyond its bounds

  showStatus: true,
};
/* ================================================== */

const P = 16;
const DEG = Math.PI/180;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const EMBED = new URLSearchParams(location.search).has("embed");
if (EMBED) document.documentElement.classList.add("embed");

const stage = document.getElementById("stage");
const ctx = stage.getContext("2d");
const hintEl = document.getElementById("hint");
const statusEl = document.getElementById("status");

let W = 0, H = 0, dpr = 1, DS = 20;
let scene = null, img = { s: 1, ox: 0, oy: 0 };

// lens state
const lens = { x: 0, y: 0, th: 0 };
const gaze = { sac: false, t: 0, dur: 0, from: null, to: null, dvx: 0, dvy: 0 };
let cursor = null, lastPt = null, sv = [0, 0], lastHeading = null, rollTarget = 0, rollVel = 0;
let lastMoveT = -1e9, interacted = false, wasIdle = true;
let lastT = performance.now();

/* ---------- assets ---------- */
function loadImage(url) {
  return new Promise(res => {
    if (!url) return res(null);
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = url;
  });
}

function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Procedural forest interior, seamlessly periodic in x and y (no mirroring needed).
function proceduralScene() {
  const SW = 2048, SH = 1024, c = document.createElement("canvas");
  c.width = SW; c.height = SH;
  const g = c.getContext("2d"), r = rng(11);
  const gauss = () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r()); };
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i]-v)*t));
  const rgba = (a, al = 1) => `rgba(${a[0]},${a[1]},${a[2]},${al})`;
  const wrapped = (x, y, ex, ey, fn) => {      // draw copies across the periodic boundary
    for (const ox of [-SW, 0, SW]) {
      if (x+ox+ex < 0 || x+ox-ex > SW) continue;
      for (const oy of [-SH, 0, SH]) {
        if (y+oy+ey < 0 || y+oy-ey > SH) continue;
        g.save(); g.translate(ox, oy); fn(); g.restore();
      }
    }
  };
  const fog = [176, 190, 168];
  g.fillStyle = rgba([118, 138, 112]); g.fillRect(0, 0, SW, SH);

  // soft light columns through the canopy
  for (let i = 0; i < 9; i++) {
    const x = r()*SW, w = 50 + 220*r(), a = 0.10 + 0.14*r();
    wrapped(x, SH/2, w, SH, () => {
      const gr = g.createLinearGradient(x-w, 0, x+w, 0);
      gr.addColorStop(0, "rgba(240,236,196,0)"); gr.addColorStop(0.5, `rgba(240,236,196,${a})`); gr.addColorStop(1, "rgba(240,236,196,0)");
      g.fillStyle = gr; g.fillRect(x-w, -1, 2*w, SH+2);
    });
  }

  const leafCols = [[38, 74, 34], [64, 104, 42], [96, 134, 52], [30, 58, 38], [120, 146, 64]];
  const foliage = (d, fogT, n) => {
    const size = 2.5 + 11*d*d + 2*d;
    for (let k = 0; k < n; k++) {
      const cx = r()*SW, cy = r()*SH, R = (30 + 90*r())*(0.5 + d), nl = Math.round(30 + 70*r());
      const base = leafCols[Math.floor(r()*leafCols.length)];
      for (let i = 0; i < nl; i++) {
        const lx = cx + gauss()*R, ly = cy + gauss()*R*0.7, rx = size*(0.6 + 0.9*r()), ang = r()*Math.PI;
        const col = mix(mix(base, [190, 210, 120], 0.35*r()*r()), fog, fogT);
        g.fillStyle = rgba(col, 0.8 + 0.2*r());
        wrapped(lx, ly, rx, rx, () => { g.beginPath(); g.ellipse(lx, ly, rx, rx*0.42, ang, 0, 2*Math.PI); g.fill(); });
      }
    }
  };

  const trunk = (d, fogT) => {
    const w = 6 + 90*Math.pow(d, 1.6)*(0.6 + 0.8*r()), x0 = r()*SW;
    const amp = w*0.15*r(), per = 1 + Math.floor(3*r()), ph = r()*2*Math.PI;
    const xs = y => x0 + amp*Math.sin(2*Math.PI*per*y/SH + ph);
    const bark = mix([r() < 0.5 ? 62 : 82, 56 + 10*r(), 46 + 8*r()], fog, fogT);
    const dark = mix([28, 26, 22], fog, fogT), lite = mix([150, 140, 118], fog, fogT);
    wrapped(x0, SH/2, w + amp, SH, () => {
      const gr = g.createLinearGradient(x0 - w/2, 0, x0 + w/2, 0);
      gr.addColorStop(0, rgba(dark)); gr.addColorStop(0.3, rgba(mix(bark, lite, 0.35)));
      gr.addColorStop(0.6, rgba(bark)); gr.addColorStop(1, rgba(dark));
      g.fillStyle = gr; g.beginPath();
      for (let y = -8; y <= SH+8; y += 8) g.lineTo(xs(y) - w/2, y);
      for (let y = SH+8; y >= -8; y -= 8) g.lineTo(xs(y) + w/2, y);
      g.closePath(); g.fill();
      // bark furrows and highlights
      g.save(); g.clip(); g.lineCap = "round";
      const n = Math.round(w*SH/260);
      for (let i = 0; i < n; i++) {
        const y = r()*SH, bx = xs(y) + (r()-0.5)*w, L = 8 + 50*r()*(0.4 + d);
        const lt = r() < 0.3;
        g.strokeStyle = lt ? rgba(lite, 0.18) : rgba(dark, 0.35);
        g.lineWidth = 0.6 + 2.2*d*r();
        g.beginPath(); g.moveTo(bx, y); g.lineTo(bx + (r()-0.5)*3, y + L); g.stroke();
      }
      // moss
      for (let i = 0; i < w/6; i++) {
        const y = r()*SH, bx = xs(y) - w/2 + w*0.15*r();
        g.fillStyle = rgba(mix([88, 120, 46], fog, fogT), 0.35);
        g.beginPath(); g.ellipse(bx, y, w*0.2, 20 + 60*r(), 0, 0, 2*Math.PI); g.fill();
      }
      g.restore();
    });
    // a few side branches
    const nb = Math.floor(3*r());
    for (let i = 0; i < nb; i++) {
      const y = r()*SH, side = r() < 0.5 ? -1 : 1, L = (40 + 160*r())*(0.4 + d), dy = -(0.3 + 0.7*r())*L;
      const sx = xs(y) + side*w*0.4;
      wrapped(sx, y, L, L, () => {
        g.strokeStyle = rgba(mix([48, 42, 34], fog, fogT)); g.lineCap = "round";
        g.lineWidth = Math.max(1, w*0.12);
        g.beginPath(); g.moveTo(sx, y); g.quadraticCurveTo(sx + side*L*0.6, y + dy*0.2, sx + side*L, y + dy); g.stroke();
      });
    }
  };

  const layers = 6;
  for (let L = 0; L < layers; L++) {
    const d = L/(layers-1), fogT = Math.pow(1-d, 1.3)*0.78;
    foliage(d, fogT, Math.round(26 - 2*L));
    const nt = Math.round(16 - 2*L);
    for (let i = 0; i < nt; i++) trunk(d, fogT);
    foliage(d, fogT, Math.round(10 - L));
    if (L < layers-1) { g.fillStyle = rgba(fog, 0.11); g.fillRect(0, 0, SW, SH); }
  }

  // fine-grain texture so small receptive fields have something to see
  for (let i = 0; i < 26000; i++) {
    const x = r()*SW, y = r()*SH, lt = r() < 0.5;
    g.fillStyle = lt ? "rgba(255,255,230,0.07)" : "rgba(0,10,0,0.09)";
    g.fillRect(x, y, 1 + 2*r(), 1 + 2*r());
  }
  return c;
}

/* ---------- layout ---------- */
function layout() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const sw = scene.naturalWidth || scene.width, sh = scene.naturalHeight || scene.height;
  W = innerWidth;
  if (EMBED) {
    // the image spans the full width; the host sizes the iframe to the image height
    // (--hero-image-h), capped at its screen height, and the image is then cropped top and bottom
    img.s = W/sw;
    hostEl()?.style.setProperty("--hero-image-h", Math.round(sh*img.s) + "px");
    H = Math.min(Math.round(sh*img.s), innerHeight);
    embedOverlaid = textOverlaid();
    // the host's text: its right edge (for the gradient behind it)
    textRight = 0;
    try {
      const t = hostEl().querySelector(".hero__content");
      textRight = embedOverlaid ? t.getBoundingClientRect().right - frameElement.getBoundingClientRect().left : 0;
    } catch (e) {}
  } else {
    // cover the screen, but zoom out if needed so the lens (P·DS image px) fits
    H = innerHeight;
    img.s = Math.max(W/sw, H/sh);
    img.s = Math.min(img.s, CONFIG.maxLensFraction*Math.min(W, H)/(P*DS));
  }
  stage.style.height = H + "px";
  stage.width = Math.round(W*dpr); stage.height = Math.round(H*dpr);
  img.ox = (W - sw*img.s)/2; img.oy = (H - sh*img.s)/2;
  if (!cursor) [lens.x, lens.y] = home();
  clampLens();
}

// Embed: the host page's hero element, which gets --hero-image-h.
function hostEl() {
  try { return frameElement && (frameElement.closest(".hero") || frameElement.parentElement); }
  catch (e) { return null; }
}

// Embed: is the host's text overlaid on the image (wide screens; see _sass/layout/_home.scss)?
function textOverlaid() {
  try { const t = hostEl()?.querySelector(".hero__content"); return !!t && parent.getComputedStyle(t).position === "absolute"; }
  catch (e) { return false; }
}

let embedOverlaid = false, textRight = 0;

function home() {
  const h = EMBED && W > 900 ? CONFIG.homeEmbed : CONFIG.home;
  return [W*h[0], H*h[1]];
}

function lensSize() { return P*DS*img.s; }

// where the lens center may go: on screen and over the image
function lensBounds() {
  const m = lensSize()*0.6, sw = scene.naturalWidth || scene.width, sh = scene.naturalHeight || scene.height;
  let x0 = Math.max(0, img.ox) + m, x1 = Math.min(W, img.ox + sw*img.s) - m;
  let y0 = Math.max(0, img.oy) + m, y1 = Math.min(H, img.oy + sh*img.s) - m;
  if (EMBED) {
    // stay clear of the host's text on the left
    if (embedOverlaid) x0 = Math.max(x0, CONFIG.embedLensMinX*W + m);
  }
  return x0 < x1 && y0 < y1 ? { x0, x1, y0, y1 } : { x0: W/2, x1: W/2, y0: H/2, y1: H/2 };
}

function clampLens() {
  const b = lensBounds();
  lens.x = Math.min(b.x1, Math.max(b.x0, lens.x));
  lens.y = Math.min(b.y1, Math.max(b.y0, lens.y));
}

/* ---------- input ---------- */
function onMove(e) {
  // the pointer steers the lens only within (a margin around) the lens bounds; elsewhere it is a normal cursor
  const b = lensBounds(), pad = CONFIG.steerPad*lensSize();
  const inside = e.clientX >= b.x0 - pad && e.clientX <= b.x1 + pad && e.clientY >= b.y0 - pad && e.clientY <= b.y1 + pad;
  stage.classList.toggle("steering", inside);
  if (!inside) { lastPt = null; return; }
  const t = performance.now();
  cursor = { x: e.clientX, y: e.clientY };
  if (lastPt && t - lastPt.t < 200) {
    const dt = Math.max(8, t - lastPt.t)/1000;
    const vx = (e.clientX - lastPt.x)/dt, vy = (e.clientY - lastPt.y)/dt;
    sv[0] += (vx - sv[0])*0.35; sv[1] += (vy - sv[1])*0.35;
    const sp = Math.hypot(sv[0], sv[1]);
    if (sp > 150) {
      const hd = Math.atan2(sv[1], sv[0]);
      if (lastHeading !== null) {
        let dh = hd - lastHeading;
        if (dh > Math.PI) dh -= 2*Math.PI; if (dh < -Math.PI) dh += 2*Math.PI;
        const r = (dh/dt)/DEG * CONFIG.rollGain * Math.min(1, sp/500);
        rollTarget = Math.max(-CONFIG.maxRoll, Math.min(CONFIG.maxRoll, r));
      }
      lastHeading = hd;
    } else { lastHeading = null; rollTarget *= 0.5; }
  } else { sv = [0, 0]; lastHeading = null; }
  lastPt = { x: e.clientX, y: e.clientY, t };
  lastMoveT = t;
  if (!interacted) { interacted = true; hintEl.style.opacity = 0.25; }
}

function randn() {
  let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

const rand = ([a, b]) => a + (b - a)*Math.random();

function startFixation() {
  gaze.sac = false; gaze.t = 0;
  gaze.dur = rand(CONFIG.fixation)*(reduceMotion ? 2 : 1);
}

function startSaccade() {
  const sc = Math.min(W, H), b = lensBounds();
  // targets: around home, within the lens bounds
  let [hx, hy] = home(), ex = CONFIG.wander[0]*W, ey = CONFIG.wander[1]*H;
  const rx0 = Math.max(b.x0, hx - ex), rx1 = Math.min(b.x1, hx + ex), ry0 = Math.max(b.y0, hy - ey), ry1 = Math.min(b.y1, hy + ey);
  if (rx0 < rx1 && ry0 < ry1) { hx = (rx0 + rx1)/2; hy = (ry0 + ry1)/2; ex = (rx1 - rx0)/2; ey = (ry1 - ry0)/2; }
  else { hx = (b.x0 + b.x1)/2; hy = (b.y0 + b.y1)/2; ex = (b.x1 - b.x0)/2 + 1; ey = (b.y1 - b.y0)/2 + 1; }
  let x = lens.x, y = lens.y;
  for (let i = 0; i < 12; i++) {       // a random jump that lands in the wander region
    const amp = rand(CONFIG.saccadeAmp)*sc*(reduceMotion ? 0.5 : 1), a = 2*Math.PI*Math.random();
    x = lens.x + amp*Math.cos(a); y = lens.y + amp*Math.sin(a);
    if (Math.abs(x - hx) < ex && Math.abs(y - hy) < ey) break;
    // fallback: aim back toward home
    x = lens.x + (hx - lens.x)*0.6 + amp*0.3*Math.cos(a); y = lens.y + (hy - lens.y)*0.6 + amp*0.3*Math.sin(a);
  }
  x = Math.min(b.x1, Math.max(b.x0, x)); y = Math.min(b.y1, Math.max(b.y0, y));
  const amp = Math.hypot(x - lens.x, y - lens.y);
  gaze.sac = true; gaze.t = 0;
  gaze.dur = CONFIG.saccadeDur[0] + CONFIG.saccadeDur[1]*amp;
  gaze.from = { x: lens.x, y: lens.y, th: lens.th };
  gaze.to = { x, y, th: 0.5*lens.th + CONFIG.saccadeRoll*DEG*randn()*(reduceMotion ? 0.5 : 1) };
}

function idleGaze(dt) {
  gaze.t += dt;
  if (gaze.sac) {
    // minimum-jerk profile: smooth start and stop, bell-shaped velocity
    const u = Math.min(1, gaze.t/gaze.dur), s = u*u*u*(10 - 15*u + 6*u*u), f = gaze.from, g = gaze.to;
    lens.x = f.x + (g.x - f.x)*s; lens.y = f.y + (g.y - f.y)*s; lens.th = f.th + (g.th - f.th)*s;
    if (u >= 1) { gaze.dvx = gaze.dvy = 0; startFixation(); }
  } else {
    // fixation: slow, smooth drift (low-pass filtered noise)
    const k = 1 - Math.exp(-dt/CONFIG.driftTau), sd = CONFIG.driftSigma*Math.sqrt(2*CONFIG.driftTau/Math.max(dt, 1e-3));
    gaze.dvx += (sd*randn() - gaze.dvx)*k; gaze.dvy += (sd*randn() - gaze.dvy)*k;
    lens.x += gaze.dvx*dt; lens.y += gaze.dvy*dt;
    if (gaze.t >= gaze.dur) startSaccade();
  }
}

function updateMotion(dt, now) {
  const active = now - lastMoveT < CONFIG.idleDelay && cursor;
  let vr;
  if (now - lastMoveT > 60) rollTarget *= Math.exp(-dt/0.08);
  if (active) {
    const f = 1 - Math.exp(-dt/CONFIG.lensFollow);
    lens.x += (cursor.x - lens.x)*f; lens.y += (cursor.y - lens.y)*f;
    rollVel += (rollTarget - rollVel)*(1 - Math.exp(-dt/0.05));
    vr = rollVel;
    wasIdle = false;
  } else {
    if (!wasIdle) { startFixation(); wasIdle = true; }
    const th0 = lens.th;
    idleGaze(dt);
    vr = (lens.th - th0)/Math.max(dt, 1e-3)/DEG; rollVel = vr;
  }
  if (active || !gaze.sac) clampLens();
  lens.th += vr*dt*DEG;
}

/* ---------- render ---------- */
function render() {
  const Ls = lensSize(), rad = Math.min(CONFIG.lensRadius, Ls/4);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  const sw = scene.naturalWidth || scene.width, sh = scene.naturalHeight || scene.height;
  ctx.drawImage(scene, img.ox, img.oy, sw*img.s, sh*img.s);

  // darken outside the lens
  const lp = new Path2D(); lp.roundRect(-Ls/2, -Ls/2, Ls, Ls, rad);
  const m = new DOMMatrix().translate(lens.x, lens.y).rotate(lens.th/DEG);
  const veil = new Path2D(); veil.rect(0, 0, W, H); veil.addPath(lp, m);
  ctx.fillStyle = `rgba(7,8,10,${1 - CONFIG.outsideVisibility})`;
  ctx.fill(veil, "evenodd");
  // embed: shade behind the host's text, fading out to the right (not over the lens)
  if (textRight > 0) {
    const end = textRight + CONFIG.textFade, [a0, a1] = CONFIG.textShade;
    const gr = ctx.createLinearGradient(0, 0, end, 0);
    gr.addColorStop(0, `rgba(7,8,10,${a0})`); gr.addColorStop(textRight/end, `rgba(7,8,10,${a1})`); gr.addColorStop(1, "rgba(7,8,10,0)");
    ctx.fillStyle = gr;
    ctx.fill(veil, "evenodd");
  }

  // lens: the full-resolution image shows through
  ctx.save();
  ctx.translate(lens.x, lens.y); ctx.rotate(lens.th);
  ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.stroke(lp);
  ctx.lineWidth = 6; ctx.strokeStyle = "rgba(255,255,255,.06)"; ctx.stroke(lp);
  // orientation tick (makes roll visible)
  ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -Ls/2 - 4); ctx.lineTo(0, -Ls/2 - 12); ctx.stroke();
  ctx.restore();
}

let onScreen = true;
function loop(now) {
  if (!onScreen || document.hidden) { lastT = now; requestAnimationFrame(loop); return; }
  const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
  updateMotion(dt, now);
  render();
  requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
(async () => {
  const im = await loadImage(CONFIG.imageUrl);
  scene = im || proceduralScene();
  DS = CONFIG.downsample;
  if (CONFIG.showStatus && !im) statusEl.textContent = "placeholder forest";
  layout();
  addEventListener("resize", layout);
  addEventListener("pointermove", onMove, { passive: true });
  addEventListener("pointerdown", onMove, { passive: true });
  if (EMBED) {                     // pause while the hero is scrolled out of view
    try { new parent.IntersectionObserver(es => { onScreen = es[0].isIntersecting; }).observe(frameElement); }
    catch (e) {}
  }
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(loop); });
})();
})();
</script>
</body>
